# Замена аннотации nginx.ingress.kubernetes.io/from-to-www-redirect: www.rating.bastilia.ru -> rating.bastilia.ru.
# В Gateway API правила HTTPRoute не матчатся по хосту, поэтому редирект — отдельный маршрут со своим hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bastilia-rating-www-redirect
spec:
  hostnames:
    - www.rating.bastilia.ru
  parentRefs:
    - name: main
      namespace: infra
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: rating.bastilia.ru
            statusCode: 301
