name: Deploy
on:
  workflow_call:
    inputs:
      deployVersion:
        required: true
        type: string
      environment_url:
        required: true
        type: string
      environment:
        required: true
        type: string
env:
  APP_NAME: bastilia-rating


jobs:
  deploy:
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment_url }}
    name: deploy
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN нужен только actions/checkout; реестр и кластер — через секреты.
    # Права вызывающего job'а ограничивают эти, поэтому менять вместе с deploy-prod.yml.
    permissions:
      contents: read
    steps:
      - name: Log in to Selectel Container Registry
        id: login-cr
        uses: joinrpg/deploy-actions/selectel-cr-login@v1
        with:
          username: ${{ vars.SELECTEL_CR_USERNAME }}
          password: ${{ secrets.SELECTEL_CR_PASSWORD }}

      - name: Resolve image digests
        id: check_existence
        uses: joinrpg/deploy-actions/resolve-image-digests@v1
        with:
          version: ${{ inputs.deployVersion }}
          images: |
            bastilia-rating=joinrpg/bastilia-rating
            bastilia-rating-migrator=joinrpg/bastilia-rating-migrator

      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup kubectl context
        uses: joinrpg/deploy-actions/setup-kubectl-context@v1
        with:
          k8s-url: ${{ vars.SELECTEL_K8S_SERVER }}
          # YAML объекта Secret сервис-аккаунта: kubectl -n kube-system get secret <sa>-token -o yaml
          deploy-sa-secret: ${{ secrets.SELECTEL_DEPLOY_SA_SECRET }}

      - name: Generate environment manifests
        uses: joinrpg/deploy-actions/render-deploy-manifests@v1
        with:
          overlay-path: ./manifests/${{ inputs.environment }}
          secret-name: bastilia-rating-secret
          secrets-json: ${{ toJSON(secrets) }}
          images-yaml: ${{ steps.check_existence.outputs.images-yaml }}

      - name: Apply DB migrations
        uses: joinrpg/deploy-actions/run-db-migrations@v1
        with:
          namespace: ${{ inputs.environment }}
          job-name: bastilia-rating-migrator
          secret-glob: ./kustomize_output/v1_secret_bastilia-rating-secret-*
          migration-manifest: ./kustomize_output/batch_v1_job_bastilia-rating-migrator.yaml

      - name: Deploy to k8s
        uses: joinrpg/deploy-actions/apply-with-prune@v1
        with:
          namespace: ${{ inputs.environment }}
          rollout-deployments: ${{ env.APP_NAME }}