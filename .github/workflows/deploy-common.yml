name: Deploy
on:
  workflow_call:
    inputs:
      deployVersion:
        required: true
        type: string
      environment_url:
        required: true
        type: string
      environment:
        required: true
        type: string
env:
  APP_NAME: bastilia-rating


jobs:
  deploy:
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment_url }}
    name: deploy
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN нужен только actions/checkout; реестр и кластер — через секреты.
    # Права вызывающего job'а ограничивают эти, поэтому менять вместе с deploy-prod.yml.
    permissions:
      contents: read
    steps:
      - name: Log in to Selectel Container Registry
        id: login-cr
        uses: joinrpg/deploy-actions/selectel-cr-login@v1
        with:
          username: ${{ vars.SELECTEL_CR_USERNAME }}
          password: ${{ secrets.SELECTEL_CR_PASSWORD }}

      - name: Resolve image digests
        id: check_existence
        uses: joinrpg/deploy-actions/resolve-image-digests@v1
        with:
          version: ${{ inputs.deployVersion }}
          images: |
            bastilia-rating=joinrpg/bastilia-rating
            bastilia-rating-migrator=joinrpg/bastilia-rating-migrator

      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup kubectl context
        uses: joinrpg/deploy-actions/setup-kubectl-context@v1
        with:
          k8s-url: ${{ vars.SELECTEL_K8S_SERVER }}
          # YAML объекта Secret сервис-аккаунта: kubectl -n kube-system get secret <sa>-token -o yaml
          deploy-sa-secret: ${{ secrets.SELECTEL_DEPLOY_SA_SECRET }}

      - name: Generate environment manifests
        uses: joinrpg/deploy-actions/render-deploy-manifests@v1
        with:
          overlay-path: ./manifests/${{ inputs.environment }}
          secret-name: bastilia-rating-secret
          secrets-json: ${{ toJSON(secrets) }}
          images-yaml: ${{ steps.check_existence.outputs.images-yaml }}

# Uncomment for diagnostics. Warning! Output contains base64 encoded secrets
#      - name: Show generated environment manifests
#        run: cat ./kustomize_output/*

      - name: Apply DB migrations
        run: |
          $ErrorActionPreference = 'Stop'

          #Add new generated secret, replace old migration job
          &"kubectl" "--%" "replace --force --save-config -f ./kustomize_output/v1_secret_bastilia-rating-secret-* -f ./kustomize_output/batch_v1_job_bastilia-rating-migrator.yaml -n $env:ENVIRONMENT"
          if ($LastExitCode -ne 0) {exit $LastExitCode}

          Write-Output "Waiting for job/bastilia-rating-migrator to be completed or failed..."

          #Keep waiting while job is not completed or failed
          while ($true){

          $status = &"kubectl" "--%" "get job bastilia-rating-migrator -n $env:ENVIRONMENT -o json" | ConvertFrom-Json
          if ($LastExitCode -ne 0) {exit $LastExitCode}
          $conditions = $status.status.conditions
          if ($conditions) {
              foreach ($condition in $conditions) {
              if ($condition.type -eq "Complete" -and $condition.status -eq "True") {
                  Write-Output "✅ Job завершен успешно!"
                  exit 0
              }
              elseif ($condition.type -eq "Failed" -and $condition.status -eq "True") {
                  Write-Output "Migration has failed. Migration's job pod info:"
                  &"kubectl" "--%"  "get pods -n $env:ENVIRONMENT --selector=job-name=bastilia-rating-migrator -o=yaml"
                  exit 1
              }
              }
          }


          #Check last event for error. Must throw an error if, for instance, namespace CPU quota was exceeded
          $LastEventForJob = &"kubectl" "--%" "get events -n $env:ENVIRONMENT --sort-by=.metadata.creationTimestamp --field-selector involvedObject.kind=Job,involvedObject.name=bastilia-rating-migrator -o jsonpath='{.items[-1:].message}'"
          if ($LastEventForJob -imatch "^'Error .*") { throw $LastEventForJob }

          &"kubectl" "--%" "logs -n $env:ENVIRONMENT --follow job/bastilia-rating-migrator"
          Start-Sleep 3
          }
        shell: pwsh

      - name: Deploy to k8s
        uses: joinrpg/deploy-actions/apply-with-prune@v1
        with:
          namespace: ${{ inputs.environment }}
          prune-selector: managed-by-kustomize=true
          rollout-deployments: ${{ env.APP_NAME }}