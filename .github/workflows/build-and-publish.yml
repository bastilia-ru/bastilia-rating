name: Build and publish

on:
  pull_request:
  merge_group:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - v**
  workflow_dispatch:

env:
  APP_PROJECT: ./Bastilia.Rating.Portal/Bastilia.Rating.Portal.csproj
  MIGRATOR_PROJECT: ./Bastilia.Rating.Migrator/Bastilia.Rating.Migrator.csproj

  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      checks: write
      actions: write
      statuses: write

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch the whole repo history

    - name: Calculate version  # Fills env.CALCULATED_VERSION and env.CALCULATED_VERSION_IS_RELEASE
      id: version
      uses: joinrpg/deploy-actions/calculate-version@v1
      with:
        ref-name: ${{ github.ref_name }}
        ref-type: ${{ github.ref_type }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        global-json-file: global.json

    - name: Restore nuget dependencies cache
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        # Look to see if there is a cache hit for the corresponding requirements file
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget

 #temporary disable docker cache
 #   - name: Restore docker images cache
 #     uses: satackey/action-docker-layer-caching@v0.0.11
 #     continue-on-error: true

    - name: Restore
      run: dotnet restore

    - name: Format
      run: dotnet format --no-restore --verify-no-changes --severity error

    - name: Build portal
      run: dotnet build -c Release -r linux-x64 --property:Version=${{ env.CALCULATED_VERSION }}  ${APP_PROJECT}

    - name: Build migrator
      run: dotnet build -c Release -r linux-x64 --property:Version=${{ env.CALCULATED_VERSION }}  ${MIGRATOR_PROJECT}

    - name: Test
      run: dotnet test -c Release --logger trx --results-directory ./TestResults

    - name: Save test results to artifacts
      uses: actions/upload-artifact@v7  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        name: test-results
        path: TestResults

    #Rest of the pipeline implies write api privileges and can't be run on PRs

    - name: Log in to Selectel Container Registry
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      id: login-cr
      uses: joinrpg/deploy-actions/selectel-cr-login@v1
      with:
        username: ${{ vars.SELECTEL_CR_USERNAME }}
        password: ${{ secrets.SELECTEL_CR_PASSWORD }}

    # SDK собирает образы в локальный docker, а пушит docker push: при прямом пуше из SDK
    # Selectel возвращает в Location внутренний адрес (*.craas-service.svc) и загрузка слоёв падает.
    - name: Publish images
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      uses: joinrpg/deploy-actions/publish-dotnet-containers@v1
      with:
        version: ${{ env.CALCULATED_VERSION }}
        extra-publish-args: --no-build
        projects: |
          joinrpg/bastilia-rating=./Bastilia.Rating.Portal/Bastilia.Rating.Portal.csproj
          joinrpg/bastilia-rating-migrator=./Bastilia.Rating.Migrator/Bastilia.Rating.Migrator.csproj
