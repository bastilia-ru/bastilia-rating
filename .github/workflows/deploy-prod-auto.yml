name: Deploy to prod automatically after build
on:
  workflow_run:
    workflows: [Build and publish]
    types: [completed]
    branches: [master]

concurrency:
  group: prod
  cancel-in-progress: true

jobs:
  deploy:
    # Только push в master: «Build and publish» идёт и на PR, а у PR из форка head_branch тоже может быть master.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-common.yml
    with:
      deployVersion: latest
      environment: bastilia-rating-prod
      environment_url: https://rating.bastilia.ru
    secrets: inherit
